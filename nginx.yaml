apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice
  namespace: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: practice
  template:
    metadata:
      labels:
        app: practice
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80


---
apiVersion: v1
kind: Service
metadata:
  name: practice
  namespace: nginx
spec:
  selector:
    app: practice
  ports:
    - port: 80
      targetPort: 80


# Adding PDB
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: practice-pdb
  namespace: nginx
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: practice
